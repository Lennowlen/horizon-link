name: Deploy to Rann-Labs Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Docker Stack to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH & Deploy to Rann-Labs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RANN_LABS_HOST }}
          username: ${{ secrets.RANN_LABS_USER }}
          password: ${{ secrets.RANN_LABS_PASSWORD }}
          key: ${{ secrets.RANN_LABS_SSH_KEY }}
          port: ${{ secrets.RANN_LABS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Menyiapkan direktori deployment di rann-labs..."
            DEPLOY_DIR="/opt/horizon-link"
            echo '${{ secrets.RANN_LABS_PASSWORD }}' | sudo -S mkdir -p "$DEPLOY_DIR"
            echo '${{ secrets.RANN_LABS_PASSWORD }}' | sudo -S chown -R $USER:$USER "$DEPLOY_DIR"
            
            # Sinkronisasi repo jika sudah ada git remote, atau pull kode terbaru
            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            # Siapkan .env
            echo "Membuat file .env dari secrets..."
            cp -f .env.example .env
            sed -i "s|SERVER_IP=.*|SERVER_IP=${{ secrets.RANN_LABS_SERVER_IP }}|g" .env
            sed -i "s|NAT_IP=.*|NAT_IP=${{ secrets.RANN_LABS_NAT_IP || secrets.RANN_LABS_SERVER_IP }}|g" .env
            sed -i "s|NEXTENDO_BASE_URL=.*|NEXTENDO_BASE_URL=${{ secrets.HORIZONLINK_BASE_URL || 'https://horizon.rann.web.id' }}|g" .env
            sed -i "s|NEXTENDO_SECRET=.*|NEXTENDO_SECRET=${{ secrets.NEXTENDO_SECRET }}|g" .env
            sed -i "s|NEXTENDO_INTERNAL_KEY=.*|NEXTENDO_INTERNAL_KEY=${{ secrets.NEXTENDO_INTERNAL_KEY }}|g" .env
            sed -i "s|NEXTENDO_SECURE_PASSWORD=.*|NEXTENDO_SECURE_PASSWORD=${{ secrets.NEXTENDO_SECURE_PASSWORD }}|g" .env
            echo "CONNTEST_PORT=${{ secrets.CONNTEST_PORT || '8088' }}" >> .env
            echo "SNI_ROUTER_PORT=${{ secrets.SNI_ROUTER_PORT || '8443' }}" >> .env

            echo "🐳 Menjalankan Docker Compose di rann-labs..."
            echo '${{ secrets.RANN_LABS_PASSWORD }}' | sudo -S docker compose down --remove-orphans || true
            echo '${{ secrets.RANN_LABS_PASSWORD }}' | sudo -S docker compose build --pull
            echo '${{ secrets.RANN_LABS_PASSWORD }}' | sudo -S docker compose up -d

            echo "✅ Deployment rann-labs berhasil aktif!"
            echo '${{ secrets.RANN_LABS_PASSWORD }}' | sudo -S docker compose ps
