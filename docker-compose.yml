services:
  # 1. SNI Router: Passthrough TLS ke masing-masing auth server tanpa membuka sertifikat
  sni-router:
    image: golang:1.23-alpine
    container_name: nextendo-sni-router
    restart: unless-stopped
    ports:
      - "${SNI_ROUTER_PORT:-8443}:443"
    environment:
      - MK8_AUTH=mk8:443
      - SSBU_AUTH=ssbu:443
      - SPLATOON2_AUTH=splatoon2:443
    command: sh -c "apk add --no-cache git && git clone https://github.com/NextendoNetwork/sni-router.git /app && cd /app && go build -o /app/server . && /app/server"
    networks:
      - nextendo-net

  # 2. Account Server: Mengelola user, friends, friend code, presence, dan JWT signing
  account:
    image: golang:1.23-alpine
    container_name: nextendo-account
    restart: unless-stopped
    ports:
      - "${ACCOUNT_PORT:-8080}:8080"
    environment:
      - NEXTENDO_BASE_URL=${NEXTENDO_BASE_URL:-https://switch.lan}
      - NEXTENDO_SECRET=${NEXTENDO_SECRET}
      - NEXTENDO_INTERNAL_KEY=${NEXTENDO_INTERNAL_KEY}
      - NEXTENDO_ADMIN_EMAILS=${NEXTENDO_ADMIN_EMAILS}
      - DATABASE_PATH=/data/nextendo.db
    volumes:
      - account-data:/data
    command: sh -c "apk add --no-cache git gcc musl-dev && git clone https://github.com/NextendoNetwork/nextendo-account.git /app && cd /app && go build -o /app/server . && /app/server"
    networks:
      - nextendo-net

  # 3. Game Server Core (MK8DX NEX/PRUDP)
  mk8-server:
    image: golang:1.23-alpine
    container_name: nextendo-mk8
    restart: unless-stopped
    ports:
      - "60003:60003/udp"
    environment:
      - NEXTENDO_HOST=0.0.0.0:60003
      - NEXTENDO_ACCOUNT_URL=http://account:8080
      - NEXTENDO_SECRET=${NEXTENDO_SECRET}
      - NEXTENDO_INTERNAL_KEY=${NEXTENDO_INTERNAL_KEY}
      - NEXTENDO_SECURE_PASSWORD=${NEXTENDO_SECURE_PASSWORD}
    command: sh -c "apk add --no-cache git && git clone https://github.com/NextendoNetwork/nextendo-nex.git /app && cd /app && go build -o /app/server . && /app/server"
    depends_on:
      - account
    networks:
      - nextendo-net

  # 4. NAT-check Responder (nncs)
  nncs:
    image: golang:1.23-alpine
    container_name: nextendo-nncs
    restart: unless-stopped
    environment:
      - NNCS_SERVER_IP=${SERVER_IP}
    network_mode: host
    command: sh -c "apk add --no-cache git && git clone https://github.com/NextendoNetwork/nextendo-nncs.git /app && cd /app && go build -o /app/server . && /app/server"

  # 5. Nginx Gateway & Conntest Handler (Connection Test & Telemetry Sink)
  nginx-gateway:
    image: nginx:alpine
    container_name: nextendo-nginx-gateway
    restart: unless-stopped
    ports:
      - "${CONNTEST_PORT:-8088}:80"
    volumes:
      - ./nginx/conntest.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nextendo-net

  # 6. Custom Web Portal (Modern Dark UI Dashboard & Registration)
  web-portal:
    build:
      context: ./web-portal
    container_name: nextendo-web-portal
    restart: unless-stopped
    ports:
      - "${WEB_PORTAL_PORT:-3080}:3000"
    environment:
      - NEXTENDO_API_URL=http://account:8080
      - NEXTENDO_PUBLIC_HOST=${NEXTENDO_PUBLIC_HOST:-switch.lan}
    depends_on:
      - account
    networks:
      - nextendo-net
      - ut-network

networks:
  nextendo-net:
    driver: bridge
  ut-network:
    external: true
    name: ut-tracker_ut-network

volumes:
  account-data:
