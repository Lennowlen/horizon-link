server {
    listen 80;
    server_name ctest.cdn.nintendo.net conntest.nintendowifi.net;

    # Handle connection test Nintendo Switch OS
    # Mengembalikan HTTP 200 dan header X-Organization agar tidak memicu captive portal login
    location / {
        add_header X-Organization "Nintendo";
        add_header Content-Type "text/html";
        return 200 '<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html><head><title>HTML Page</title></head><body bgcolor="#FFFFFF">This is test.html page</body></html>';
    }
}

server {
    listen 80;
    server_name receive-lp1.dg.srv.nintendo.net receive-lp1.er.srv.nintendo.net aqua.hac.lp1.dauth.nintendo.net sun.hac.lp1.dauth.nintendo.net;

    # Telemetry sink: Mengembalikan HTTP 200 kosong agar applet NSO tidak hang/freeze
    location / {
        return 200 '';
    }
}
